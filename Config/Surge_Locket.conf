# ============================================================
# 🔐 LOCKET GOLD & FILTER VIP - CẤU HÌNH SURGE
# ============================================================
# Tác giả & Bản quyền: DinhTuan
# Hỗ trợ: Surge iOS / Mac
# ============================================================

[Rule]
AND,((DOMAIN,firebaseremoteconfig.googleapis.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.revenuecat.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.locketcamera.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,locketcamera.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,us-central1-locket-4252a.cloudfunctions.net),(PROTOCOL,UDP)),REJECT

[Host]
firebaseremoteconfigrealtime.googleapis.com = 0.0.0.0

[Header Rewrite]
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del x-revenuecat-etag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del X-RevenueCat-ETag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-none-match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-None-Match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-modified-since
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-Modified-Since

^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ header-del if-none-match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ header-del If-None-Match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ header-del if-modified-since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ header-del If-Modified-Since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ header-del x-goog-if-none-match

^https?:\/\/api\.locketcamera\.com\/.+ header-del if-none-match
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-None-Match
^https?:\/\/api\.locketcamera\.com\/.+ header-del if-modified-since
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-Modified-Since

[Script]
deleteHeader_RC = type=http-request,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/DinhTuan/locket/main/js/deleteHeader.js,timeout=60
deleteHeader_Firebase = type=http-request,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+,script-path=https://raw.githubusercontent.com/DinhTuan/locket/main/js/deleteHeader.js,timeout=60
revenuecat = type=http-response,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/DinhTuan/locket/main/js/revenuecat.js,requires-body=true,max-size=-1,timeout=60
locket_rc = type=http-response,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+,script-path=https://raw.githubusercontent.com/DinhTuan/locket/main/js/forceGold4.3.js,requires-body=true,max-size=-1,timeout=60
locket_change_profile = type=http-request,pattern=^https?:\/\/api\.locketcamera\.com\/changeProfileInfo,script-path=https://raw.githubusercontent.com/DinhTuan/locket/main/js/locket_change_profile.js,timeout=60
locket_filter_resp = type=http-response,pattern=^https?:\/\/api\.locketcamera\.com\/.+,script-path=https://raw.githubusercontent.com/DinhTuan/locket/main/js/locket_change_profile.js,requires-body=true,max-size=2097152,timeout=60
locket_pb_req = type=http-request,pattern=^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/generateFilteredImage,script-path=https://raw.githubusercontent.com/DinhTuan/locket/main/js/locket_pb_req.js,requires-body=true,max-size=-1,timeout=60

[MITM]
hostname = %APPEND% api.revenuecat.com, firebaseremoteconfig.googleapis.com, api.locketcamera.com, *.locketcamera.com, us-central1-locket-4252a.cloudfunctions.net

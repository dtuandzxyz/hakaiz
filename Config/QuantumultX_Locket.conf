[rewrite_local]
# 1. Chống lỗi 304 Cache RevenueCat & Firebase
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) url script-request-header https://raw.githubusercontent.com/DinhTuan/locket/main/js/deleteHeader.js
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ url script-request-header https://raw.githubusercontent.com/DinhTuan/locket/main/js/deleteHeader.js

# 2. Mở khoá RevenueCat Locket Gold
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) url script-response-body https://raw.githubusercontent.com/DinhTuan/locket/main/js/revenuecat.js

# 3. Ép cờ Locket Gold & Video 45s (Firebase Remote Config)
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ url script-response-body https://raw.githubusercontent.com/DinhTuan/locket/main/js/forceGold4.3.js

# 4. Giả lập Profile & Mở khoá Filter VIP
^https?:\/\/api\.locketcamera\.com\/changeProfileInfo url script-request-body https://raw.githubusercontent.com/DinhTuan/locket/main/js/locket_change_profile.js
^https?:\/\/api\.locketcamera\.com\/.+ url script-response-body https://raw.githubusercontent.com/DinhTuan/locket/main/js/locket_change_profile.js

# 5. Photobooth 4 ảnh & AI Filter
^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/generateFilteredImage url script-request-body https://raw.githubusercontent.com/DinhTuan/locket/main/js/locket_pb_req.js

[mitm]
hostname = api.revenuecat.com, firebaseremoteconfig.googleapis.com, api.locketcamera.com, *.locketcamera.com, us-central1-locket-4252a.cloudfunctions.net
